spring:
  application:
    name: observx-gateway

  cloud:
    gateway:
      routes:
        # Collector routes
        - id: collector-metrics
          uri: ${COLLECTOR_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/metrics/**

        - id: collector-logs
          uri: ${COLLECTOR_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/logs/**

        - id: collector-traces
          uri: ${COLLECTOR_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/traces/**

        # Query service routes
        - id: query-service
          uri: ${QUERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/query/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.cloud.gateway: INFO
