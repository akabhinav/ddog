events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Upstream collectors (3 replicas)
    upstream collectors {
        least_conn;  # Use least connections algorithm
        server collector-1:8081 max_fails=3 fail_timeout=30s;
        server collector-2:8081 max_fails=3 fail_timeout=30s;
        server collector-3:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream query services (2 replicas)
    upstream query-services {
        least_conn;
        server query-service-1:8083 max_fails=3 fail_timeout=30s;
        server query-service-2:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Collector service load balancing (port 8081)
    server {
        listen 8081;
        server_name _;

        # Connection limits
        limit_conn_zone $binary_remote_addr zone=addr:10m;
        limit_conn addr 100;

        # Request rate limiting
        limit_req_zone $binary_remote_addr zone=req_limit:10m rate=1000r/s;
        limit_req zone=req_limit burst=2000 nodelay;

        location / {
            proxy_pass http://collectors;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Query service load balancing (port 8083)
    server {
        listen 8083;
        server_name _;

        location / {
            proxy_pass http://query-services;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts (longer for queries)
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Caching for GET requests
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache $http_pragma $http_authorization;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }

    # Main gateway (port 80)
    server {
        listen 80;
        server_name _;

        # Metrics ingestion endpoints -> collectors
        location /api/v1/metrics {
            proxy_pass http://collectors;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location /api/v1/logs {
            proxy_pass http://collectors;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        location /api/v1/traces {
            proxy_pass http://collectors;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # Query endpoints -> query services
        location /api/v1/query {
            proxy_pass http://query-services;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # Health check
        location /health {
            access_log off;
            return 200 "ObservX Platform - Healthy\n";
            add_header Content-Type text/plain;
        }

        # Status page
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.28.0.0/16;
            deny all;
        }
    }
}
